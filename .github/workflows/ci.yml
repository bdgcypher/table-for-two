name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint, static export
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint app components lib

      - name: Build static export
        run: npm run build

      # The native shell packages exactly these files. A route that stops being
      # emitted is a broken app on device, so assert them explicitly rather than
      # trusting the build's exit code alone.
      - name: Assert the export contains every route
        run: |
          set -euo pipefail
          for f in out/index.html out/dates/index.html out/conversations/index.html out/menu/index.html out/preferences/index.html; do
            if [ ! -f "$f" ]; then
              echo "::error::static export is missing $f"
              exit 1
            fi
            echo "ok  $f"
          done
