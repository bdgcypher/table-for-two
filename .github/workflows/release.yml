name: Release

# Cutting a release is a tag push:
#
#   npm version 0.0.1 --no-git-tag-version   # or edit package.json by hand
#   git commit -am "Release 0.0.1"
#   git tag -a v0.0.1 -m "Table for Two 0.0.1"
#   git push origin main --follow-tags
#
# The Android job ALWAYS attaches a sideloadable APK to the GitHub Release. When
# the Android signing secrets exist the APK is release-signed and a Play Store
# .aab is published alongside it; without them the APK is debug-signed — still
# installable by sideload, but not publishable. See MOBILE.md.
on:
  push:
    tags:
      - "v*"
  # Manual runs are for re-building an existing version without cutting a new
  # tag. They only produce workflow artifacts — the GitHub Release step is
  # gated on a real tag, so a dispatch can never clobber a published release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.0.1. Defaults to package.json."
        required: false
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # A tag is authoritative. Without one (manual dispatch, or a branch run)
      # fall back to package.json so the build still gets a valid version
      # instead of failing the semver check in version-info.mjs.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            CANDIDATE="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            CANDIDATE="$GITHUB_REF_NAME"
          else
            CANDIDATE="v$(node -p 'require("./package.json").version')"
            echo "::notice::No version tag on this run; using package.json ($CANDIDATE)."
          fi
          node scripts/version-info.mjs "$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "building version: $CANDIDATE"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. The APK will be debug-signed: sideloadable, but not Play-Store-ready. Run scripts/generate-android-keystore.sh and add the secrets."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/table-for-two-release.jks
          {
            echo "storeFile=table-for-two-release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/keystore.properties
          echo "Release signing configured."

      - name: Build APK and AAB
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}"

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/table-for-two-${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "dist/table-for-two-${{ steps.version.outputs.name }}.aab"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # Fails the release if the APK is not signed at all.
          "$APKSIGNER" verify --print-certs "dist/table-for-two-${{ steps.version.outputs.name }}.apk" \
            | sed -n '1,4p'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Table for Two ${{ steps.version.outputs.name }}" \
              --generate-notes
          fi

  ios:
    name: iOS archive
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      # A tag is authoritative. Without one (manual dispatch, or a branch run)
      # fall back to package.json so the build still gets a valid version
      # instead of failing the semver check in version-info.mjs.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            CANDIDATE="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            CANDIDATE="$GITHUB_REF_NAME"
          else
            CANDIDATE="v$(node -p 'require("./package.json").version')"
            echo "::notice::No version tag on this run; using package.json ($CANDIDATE)."
          fi
          node scripts/version-info.mjs "$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "building version: $CANDIDATE"

      - name: List schemes
        run: xcodebuild -list -project ios/App/App.xcodeproj

      # Proves the iOS project compiles and links. CODE_SIGNING_ALLOWED=NO means
      # no Apple account is needed for this step, which is why it always runs.
      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            MARKETING_VERSION="${{ steps.version.outputs.name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.code }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcarchive-${{ steps.version.outputs.name }}
          path: ${{ runner.temp }}/App.xcarchive
          if-no-files-found: error

      # The steps below turn that archive into a TestFlight-ready .ipa, but they
      # need an Apple Developer Program membership. Add the secrets listed in
      # MOBILE.md and they activate; without them the unsigned archive above is
      # where the iOS pipeline stops.
      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_BASE64:-}" ]; then
            echo "::notice::No Apple signing secrets configured — skipping signed export. See MOBILE.md."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/table-for-two.mobileprovision
          echo "Signing material installed."

      - name: Export signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::notice::APPLE_TEAM_ID not set — skipping IPA export. See MOBILE.md."
            exit 0
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"

      - name: Upload IPA
        if: hashFiles(format('{0}/ipa/*.ipa', runner.temp)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ steps.version.outputs.name }}
          path: ${{ runner.temp }}/ipa/*.ipa
